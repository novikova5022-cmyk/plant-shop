<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог растений</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f5f5f7);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --button-color: var(--tg-theme-button-color, #2e7d32);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    h1 { font-size: 20px; margin: 8px 4px 16px 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding-bottom: 80px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      background-color: #eee;
    }
    .title { font-size: 14px; font-weight: 600; margin: 8px 0 4px 0; }
    .price { font-size: 15px; font-weight: 700; color: var(--button-color); margin-bottom: 8px; }
    .btn {
      margin-top: auto;
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn.added { background: #e0e0e0; color: #555; }
  </style>
</head>
<body>
  <h1>🌱 Каталог растений</h1>
  <div class="grid" id="catalog"></div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const products = [
      { id: 1, name: "👑 Алоказия Cucullata", price: 1200, img: "https://placehold.co/300x300/e8f5e9/2e7d32?text=Cucullata" },
      { id: 2, name: "🐉 Алоказия Dragon Scale", price: 1500, img: "https://placehold.co/300x300/e8f5e9/2e7d32?text=Dragon+Scale" },
      { id: 3, name: "🦎 Алоказия Jacklyn", price: 1800, img: "https://placehold.co/300x300/e8f5e9/2e7d32?text=Jacklyn" },
      { id: 4, name: "🌿 Монстера Classic", price: 1000, img: "https://placehold.co/300x300/e8f5e9/2e7d32?text=Monstera" }
    ];
    let cart = {};
    const catalog = document.getElementById('catalog');
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${p.img}" alt="${p.name}">
        <div class="title">${p.name}</div>
        <div class="price">${p.price} ₽</div>
        <button class="btn" id="btn-${p.id}" onclick="toggleCart(${p.id})">В корзину</button>
      `;
      catalog.appendChild(card);
    });
    function toggleCart(id) {
      const btn = document.getElementById(`btn-${id}`);
      if (cart[id]) {
        delete cart[id];
        btn.textContent = 'В корзину';
        btn.classList.remove('added');
      } else {
        cart[id] = 1;
        btn.textContent = '✓ В корзине';
        btn.classList.add('added');
      }
      updateMainButton();
    }
    function updateMainButton() {
      const count = Object.keys(cart).length;
      if (count > 0) {
        let total = 0;
        Object.keys(cart).forEach(id => {
          total += products.find(p => p.id == id).price;
        });
        tg.MainButton.setText(`Оформить заказ (${total} ₽)`);
        tg.MainButton.show();
      } else {
        tg.MainButton.hide();
      }
    }
    tg.MainButton.onClick(() => {
      let orderItems = [];
      Object.keys(cart).forEach(id => {
        orderItems.push(products.find(p => p.id == id).name);
      });
      tg.sendData(JSON.stringify({ order: orderItems.join(", ") }));
      tg.close();
    });
  </script>
</body>
</html>
