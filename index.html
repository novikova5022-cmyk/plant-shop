<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Catalog</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f5f5f7);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #2e7d32);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 20px;
      margin: 8px 4px 16px 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding-bottom: 80px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      background-color: #eee;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      margin: 8px 0 2px 0;
    }
    .desc {
      font-size: 11px;
      color: var(--hint-color);
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .price {
      font-size: 15px;
      font-weight: 700;
      color: var(--button-color);
      margin-bottom: 8px;
    }
    .btn {
      margin-top: auto;
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn.added {
      background: #e0e0e0;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>🌱 Plant Catalog</h1>
  <div class="grid" id="catalog"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const products = [
      { 
        id: 1, 
        name: "Alocasia Cucullata", 
        desc: "Rooted baby plant, active growth", 
        price: 30, 
        img: "https://share.gemini.google/nstHzCozni4Q" 
      },
      { 
        id: 2, 
        name: "Alocasia Dragon Scale", 
        desc: "Dense textured leaves", 
        price: 60, 
        img: "https://images.unsplash.com/photo-1614594975525-e45190c55d0b?auto=format&fit=crop&w=300&q=80" 
      },
      { 
        id: 3, 
        name: "Monstera Classic", 
        desc: "Healthy rooted cutting", 
        price: 35, 
        img: "https://images.unsplash.com/photo-1614594975525-e45190c55d0b?auto=format&fit=crop&w=300&q=80" 
      }
    ];

    let cart = {};
    const catalog = document.getElementById('catalog');

    // Отрисовка товаров
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${p.img}" alt="${p.name}">
        <div class="title">${p.name}</div>
        <div class="desc">${p.desc}</div>
        <div class="price">${p.price} ₾</div>
        <button class="btn" id="btn-${p.id}" onclick="toggleCart(${p.id})">Add to cart</button>
      `;
      catalog.appendChild(card);
    });

    // Логика корзины
    function toggleCart(id) {
      const btn = document.getElementById(`btn-${id}`);
      if (cart[id]) {
        delete cart[id];
        btn.textContent = 'Add to cart';
        btn.classList.remove('added');
      } else {
        cart[id] = 1;
        btn.textContent = '✓ In cart';
        btn.classList.add('added');
      }
      updateMainButton();
    }

    // Кнопка заказа внизу Telegram
    function updateMainButton() {
      const count = Object.keys(cart).length;
      if (count > 0) {
        let total = 0;
        Object.keys(cart).forEach(id => {
          const item = products.find(p => p.id == id);
          total += item.price;
        });
        tg.MainButton.setText(`Checkout (${total} ₾)`);
        tg.MainButton.show();
      } else {
        tg.MainButton.hide();
      }
    }

    // Отправка данных при клике на кнопку заказа
    tg.MainButton.onClick(() => {
      let orderItems = [];
      Object.keys(cart).forEach(id => {
        const item = products.find(p => p.id == id);
        orderItems.push(item.name);
      });
      
      const data = {
        order: orderItems.join(", ")
      };
      
      tg.sendData(JSON.stringify(data));
      tg.close();
    });
  </script>
</body>
</html>
